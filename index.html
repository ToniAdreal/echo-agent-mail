<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <script>
      // First paint theme: saved preference, then OS preference (spec 1.8).
      try {
        var saved = localStorage.getItem('intenda-theme');
        document.documentElement.dataset.theme =
          saved === 'day' || saved === 'night'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-silver.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services: loaded once, statically, so the sign-in
         button never depends on a dynamically injected script. -->
    <script async src="https://accounts.google.com/gsi/client"></script>
    <title>Intenda 意达 · Agent Native Email</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
